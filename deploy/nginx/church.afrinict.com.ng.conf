# GraceERP — nginx site for church.afrinict.com.ng
# Copy to server:
#   sudo cp deploy/nginx/church.afrinict.com.ng.conf /etc/nginx/sites-available/graceerp
#   sudo ln -sf /etc/nginx/sites-available/graceerp /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# DNS (TTL 14400):
#   www.church.afrinict.com.ng   A   <YOUR_SERVER_IP>
#   church.afrinict.com.ng       A   <YOUR_SERVER_IP>   (optional, for redirect)
#
# TLS (after DNS propagates):
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d www.church.afrinict.com.ng -d church.afrinict.com.ng
#
# backend/.env on server:
#   FRONTEND_URL=https://www.church.afrinict.com.ng
#   PORT=2025
# Then: pm2 restart graceerp

# Redirect bare domain to www
server {
    listen 80;
    listen [::]:80;
    server_name church.afrinict.com.ng;
    return 301 http://www.church.afrinict.com.ng$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.church.afrinict.com.ng;

    client_max_body_size 110M;

    location / {
        proxy_pass http://127.0.0.1:2025;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://127.0.0.1:2025;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
